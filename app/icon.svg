<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="mark" x1="6" y1="8" x2="26" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="url(#mark)" stroke-opacity="0.35" stroke-width="1"/>

  <!-- left chevron < -->
  <path
    d="M12.2 9.2 7.4 16l4.8 6.8"
    stroke="url(#mark)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- right chevron > -->
  <path
    d="M19.8 9.2 24.6 16l-4.8 6.8"
    stroke="url(#mark)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- craft slash / -->
  <path
    d="M18.2 8.8 13.8 23.2"
    stroke="#fde047"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
